name: Build and Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxxf86vm-dev \
            libasound2-dev \
            pkg-config

      - name: Run tests
        run: go test ./...

  build-cli-linux:
    name: Build CLI (Linux)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build
        run: |
          go build -ldflags "-s -w" -o build/metronome-linux-amd64 ./cmd/metronome

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metronome-linux-amd64
          path: build/metronome-linux-amd64

  build-cli-mac:
    name: Build CLI (macOS)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (arm64)
        run: |
          go build -ldflags "-s -w" -o build/metronome-darwin-arm64 ./cmd/metronome

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metronome-darwin-arm64
          path: build/metronome-darwin-arm64

  build-cli-windows:
    name: Build CLI (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          go build -ldflags "-s -w" -o build/metronome-windows-amd64.exe ./cmd/metronome

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metronome-windows-amd64
          path: build/metronome-windows-amd64.exe

  package-mac:
    name: Package macOS App
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package macOS .app bundle
        run: make package-mac

      - name: Zip .app for upload
        run: |
          cd build
          zip -r "Workout Metronome.zip" "Workout Metronome.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workout-metronome-macos
          path: build/Workout Metronome.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-cli-linux, build-cli-mac, build-cli-windows, package-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
